services:
  nomad-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: nomad-frontend
    restart: unless-stopped
    networks:
      - traefik_proxy
    # Single Traefik route, configured via env vars (see .env.example).
    # Production deployments that need multiple routes (eg. local HTTPS +
    # public HTTP via Cloudflare Tunnel) override this whole block in
    # docker-compose.override.yml. The override is gitignored.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nomad-frontend.rule=Host(`${NOMAD_FRONTEND_HOST:-nomad.localhost}`)"
      - "traefik.http.routers.nomad-frontend.entrypoints=${NOMAD_TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.nomad-frontend.tls=${NOMAD_TRAEFIK_TLS:-false}"
      - "traefik.http.services.nomad-frontend.loadbalancer.server.port=80"
    depends_on:
      - nomad-api

  nomad-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomad-api
    restart: unless-stopped
    env_file: backend/.env
    # OSS-friendly default: store audio in ./data/audio-local (relative to repo).
    # Override this path in docker-compose.override.yml for production deployments
    # (e.g. bind to a large HDD or to a Nextcloud directory). The override file is
    # gitignored — copy docker-compose.override.example.yml as a starting point.
    volumes:
      - ./data/audio-local:/data/audio-local
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nomad-api.rule=Host(`${NOMAD_API_HOST:-nomad-api.localhost}`)"
      - "traefik.http.routers.nomad-api.entrypoints=${NOMAD_TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.nomad-api.tls=${NOMAD_TRAEFIK_TLS:-false}"
      - "traefik.http.services.nomad-api.loadbalancer.server.port=8400"

networks:
  traefik_proxy:
    external: true
