server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve nomad-api through Docker DNS: without this, nginx keeps the
    # IP it saw at startup and returns 502 once nomad-api is recreated alone
    # (incident 2026-11-24, every session list empty).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nomad_api http://nomad-api:8400;

    # API reverse proxy → backend container
    location /api/ {
        proxy_pass $nomad_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # WebSocket reverse proxy
    location /ws {
        proxy_pass $nomad_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker must never be cached by browser
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (Vite adds content hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
