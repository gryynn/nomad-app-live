[project]
name = "nomad-mcp"
version = "0.1.0"
description = "MCP server exposing NOMAD sessions to LLM agents"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
]

[project.scripts]
nomad-mcp-server = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
