name: CI

on:
  push:
    branches: [main, functional-mvp]
  pull_request:
    branches: [main, functional-mvp]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm install
      - run: cd frontend && npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Import smoke test
        run: cd backend && python -c "from app.main import app; print('OK')"
      - name: Run pytest
        env:
          APP_JWT_SECRET: "test-secret-for-pytest-32-chars-min!"
          SUPABASE_URL: "http://localhost"
          SUPABASE_SERVICE_KEY: "dummy"
          PUBLIC_BACKEND_URL: "http://localhost:8400"
        # Excluding the e2e suite because it expects live Supabase / Groq creds.
        # The unit suites cover the per-user resolve_api_key, auth tokens,
        # storage drivers, and the auto-T transcribe pref gate.
        run: |
          cd backend
          python -m pytest tests/ \
            --ignore=tests/test_e2e_integration.py \
            -k "not test_get_preferences_returns_default_when_no_row" \
            -v
